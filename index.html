      /* Splash screen: shows immediately (before the JS bundle even loads,
         so there's no flash of unstyled content), then the inline script
         below fades it out after the full brand reveal. Pure CSS/vanilla JS,
         not React, so it renders instantly on a static/prerendered page
         and never depends on hydration finishing. */
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #192743;
        transition: opacity 0.48s ease, visibility 0.48s ease;
      }
      .splash-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(5px);
      }
      .splash-mark {
        width: 156px;
        height: auto;
        opacity: 0;
        clip-path: inset(0 0 100% 0);
        transform: translateY(7px) scale(0.97);
        animation: splash-mark-in 0.72s cubic-bezier(0.22, 1, 0.36, 1) 0.04s forwards;
      }
      .splash-wordmark {
        width: 218px;
        height: auto;
        margin-top: 16px;
        filter: brightness(0) invert(1);
        opacity: 0;
        transform: translateY(4px);
        animation: splash-copy-in 0.48s ease-out 0.42s forwards;
      }
      .splash-specialty {
        margin-top: 8px;
        color: rgba(255, 255, 255, 0.5);
        font-family: Inter, Arial, sans-serif;
        font-size: 7px;
        font-weight: 400;
        letter-spacing: 0.2em;
        text-indent: 0.2em;
        text-transform: uppercase;
        opacity: 0;
        animation: splash-copy-in 0.48s ease-out 0.54s forwards;
      }
      #splash-screen.splash-exit {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes splash-mark-in {
        to { opacity: 1; clip-path: inset(0 0 0 0); transform: translateY(0) scale(1); }
      }
      @keyframes splash-copy-in {
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark,
        .splash-wordmark,
        .splash-specialty {
          animation: none;
          opacity: 1;
          transform: none;
          clip-path: none;
        }
      }
    </style>
